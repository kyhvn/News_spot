<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="جدیدترین اخبار از منابع معتبر داخلی و بین‌المللی">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="themeColorMeta" content="#f5f0eb">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
    <title>News Spot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <a href="#main-content" class="skip-link">پرش به محتوای اصلی</a>

    <!-- ===== HEADER ===== -->
    <header class="header" id="header">
        <div class="header-top">
            <a href="/" class="header-logo">
                <span class="main">News <span>Spot</span></span>
                <span class="sub">همه اخبار در یک جا</span>
            </a>
            <div class="header-clock" id="headerClock">
                <span class="clock-time" id="clockTime">--:--:--</span>
                <span class="clock-date" id="clockDate">در حال بارگذاری...</span>
            </div>
            <div class="header-actions">
                <div class="view-toggle" id="viewToggle" role="group" aria-label="نمایش">
                    <button type="button" class="active" data-view="grid" title="نمایش شبکه‌ای">▦</button>
                    <button type="button" data-view="list" title="نمایش لیستی">☰</button>
                </div>
                <button type="button" class="btn-icon" id="themeToggle" title="تغییر تم" aria-label="تغییر تم">🌓</button>
                <button type="button" class="btn-icon" id="refreshBtn" title="بروزرسانی" aria-label="بروزرسانی">⟳</button>
            </div>
        </div>
    </header>

    <main id="main-content">
        <div class="main-layout">
            <!-- ===== SIDEBAR ===== -->
            <aside class="sidebar-wrapper" id="sidebarWrapper">
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-title">📂 دسته‌بندی‌ها</div>
                    <div class="sidebar-categories" id="sidebarCategories">
                        <button class="sidebar-category active" data-category="all">
                            <span class="icon">📰</span> همه اخبار
                            <span class="count" id="allCount">0</span>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- ===== CONTENT ===== -->
            <div class="content-wrapper">
                <div class="search-bar">
                    <input class="search-input" id="searchInput" type="text" placeholder="جستجو در اخبار..." dir="rtl" autocomplete="off">
                </div>

                <!-- ===== STATUS STRIP (جایگزین overlay) ===== -->
                <div class="status-strip" id="statusStrip" hidden>
                    <div class="status-strip-inner">
                        <div class="status-strip-left">
                            <span class="status-pulse" id="statusPulse"></span>
                            <span class="status-strip-text" id="statusStripText">در حال دریافت اخبار...</span>
                        </div>
                        <div class="status-strip-right">
                            <div class="status-mini-progress">
                                <div class="status-mini-fill" id="statusMiniFill"></div>
                            </div>
                            <span class="status-mini-text" id="statusMiniText">0 / 0</span>
                            <button class="status-strip-close" id="statusStripClose" aria-label="بستن">×</button>
                        </div>
                    </div>
                    <div class="status-strip-chips" id="statusStripChips"></div>
                </div>

                <div class="stats-bar">
                    <div class="count">📨 <span id="newsCount">0</span> خبر</div>
                    <div class="time" id="updateTime">⏱️ بروزرسانی: در حال دریافت...</div>
                </div>

                <div class="news-grid" id="newsGrid" aria-busy="true">
                    <div class="skeleton" aria-hidden="true"><div class="skeleton-img"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
                    <div class="skeleton" aria-hidden="true"><div class="skeleton-img"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
                    <div class="skeleton" aria-hidden="true"><div class="skeleton-img"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
                    <div class="skeleton" aria-hidden="true"><div class="skeleton-img"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
                    <div class="skeleton" aria-hidden="true"><div class="skeleton-img"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
                    <div class="skeleton" aria-hidden="true"><div class="skeleton-img"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== BUTTON BACK TO TOP ===== -->
    <button class="back-to-top" id="backToTop" aria-label="بازگشت به بالا">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
        <span>بالا</span>
    </button>

    <!-- ===== BACKGROUND REFRESH BADGE ===== -->
    <div class="refresh-badge" id="refreshBadge" hidden>
        <span class="refresh-spinner"></span>
        <span id="refreshBadgeText">در حال بروزرسانی اخبار...</span>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer" role="dialog" aria-modal="true">

            <button class="modal-close-btn" id="modalCloseBtn" aria-label="بستن">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="modal-image-wrapper" id="modalImageWrapper">
                <img class="modal-image" id="modalImage" src="" alt="" loading="lazy">
                <div class="modal-image-overlay">
                    <span class="modal-source-badge" id="modalSourceBadge">📰 منبع</span>
                </div>
            </div>
            <div class="modal-image-placeholder-wrapper" id="modalImagePlaceholderWrapper" style="display:none;">
                <div class="modal-image-placeholder" id="modalImagePlaceholder">📰</div>
            </div>

            <div class="modal-content-body">
                <div class="modal-header">
                    <div class="modal-category" id="modalCategory">دسته‌بندی</div>
                    <div class="modal-index" id="modalIndex">1 / 10</div>
                </div>

                <h2 class="modal-title-text" id="modalTitle">عنوان خبر</h2>

                <div class="modal-meta">
                    <span class="modal-source" id="modalSource">📰 منبع</span>
                    <span class="modal-date">
                        <span class="date-abs" id="modalDate">تاریخ نامشخص</span>
                        <span class="date-rel" id="modalRelDate"></span>
                    </span>
                    <span class="modal-read-time" id="modalReadTime">⏳ ۱ دقیقه</span>
                </div>

                <div class="modal-summary-wrapper">
                    <p class="modal-summary" id="modalSummary">خلاصه خبر...</p>
                    <div class="modal-translated-text" id="modalTranslatedText"></div>
                </div>

                <div class="modal-tags" id="modalTags"></div>

                <div class="modal-actions">
                    <button type="button" class="modal-translate-btn" id="modalTranslateBtn">
                        <span>🌐</span> ترجمه
                    </button>
                    <button type="button" class="modal-share-btn" id="modalShareBtn">
                        <span>🔗</span> اشتراک‌گذاری
                    </button>
                    <a href="#" id="modalReadMore" target="_blank" rel="noopener noreferrer" class="modal-read-more-btn">
                        مطالعه کامل <span>→</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Navigation buttons OUTSIDE the modal -->
        <button class="modal-nav-outside prev" id="modalPrevBtn" aria-label="خبر قبلی">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span class="nav-label">قبلی</span>
        </button>
        <button class="modal-nav-outside next" id="modalNextBtn" aria-label="خبر بعدی">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span class="nav-label">بعدی</span>
        </button>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
